<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>个人 Catbox 图床</title>
<link rel="stylesheet" href="/static/style.css?v=41">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">

      <div class="nav-actions">

          <button class="theme-option" data-theme="light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><span>浅色</span><span class="theme-check" data-check="light">✓</span></button>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <a class="nav-btn nav-link" href="https://github.com/uncat2310/catbox-imagehost" target="_blank" rel="noopener" aria-label="GitHub 项目主页">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

  </nav>

  <main class="content">
    <div id="drop-zone" class="drop-zone">
      <input type="file" id="file-input" hidden multiple accept="image/*,video/*,audio/*">
      <div class="drop-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <p class="drop-title">拖放文件到此处</p>
      <p class="drop-sub">支持批量 · 最大 200MB · Ctrl+V 粘贴</p>
      <p class="field-hint">私人上传面板 · 上传文件仍由 Catbox 公开托管</p>
      <div id="uploading" class="uploading hidden">
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <p class="progress-label" id="progress-label"></p>
        <button id="btn-cancel-upload" class="btn btn-secondary btn-sm hidden">取消本批上传</button>
      </div>
    </div>

    <div id="result-card" class="result-card hidden">
      <div class="result-header">
        <span class="result-count" id="result-count"></span>
        <button id="btn-upload-more" class="btn btn-secondary btn-sm">继续上传</button>
      </div>
      <div class="result-list" id="result-list"></div>
      <div class="result-footer">
        <button id="btn-copy-urls" class="btn btn-primary flex-fill">拷贝直链</button>
        <button id="btn-copy-md" class="btn btn-secondary flex-fill">拷贝 Markdown</button>
      </div>
    </div>

    <footer class="app-footer">
      <span>个人 Catbox 图床 v4.1.0</span>
      <span>© 2026 uncat2310</span>
      <a href="https://github.com/uncat2310/catbox-imagehost" target="_blank" rel="noopener">GitHub</a>
    </footer>

  </main>
</div>

<div id="history-overlay" class="history-overlay">
  <section id="history-panel" class="history-drawer" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <div class="history-head">
      <div>
        <h2 id="history-title" class="history-title">上传历史</h2>
        <p id="history-subtitle" class="history-subtitle">服务端上传记录</p>
      </div>
      <button class="panel-close history-close" data-close="history-panel" aria-label="关闭历史记录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="history-toolbar" class="history-toolbar history-toolbar-drawer hidden">
      <label class="check-label"><input type="checkbox" id="check-select-all"><span>全选</span></label>
      <button id="btn-batch-copy" class="btn btn-sm btn-secondary">复制选中</button>
      <button id="btn-batch-del" class="btn btn-sm btn-danger">清除选中</button>
    </div>
    <div class="panel-scroll history-scroll" id="history-list"></div>
    <p id="history-note" class="field-hint history-note hidden">仅清除服务端历史记录，不影响 Catbox 上已上传的文件</p>
  </section>
</div>

<div id="settings-sheet" class="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"><div class="handle-bar"></div></div>
    <div class="sheet-top">
      <h2 class="sheet-title">设置</h2>
      <button class="sheet-close" id="btn-close-sheet" aria-label="关闭设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="account-summary">
        <span class="account-dot" aria-hidden="true"></span>
        <span>Catbox 账号已绑定</span>
        <span class="account-tag">个人使用</span>
      </div>

      <section class="settings-card" aria-labelledby="image-settings-title">
        <h3 class="settings-card-title" id="image-settings-title">图片处理</h3>
        <div class="settings-toggle-row">
          <div>
            <label class="settings-label" for="input-webp-enabled">转换为 WebP</label>
            <p class="field-hint">压缩静态图片，动图保留原格式</p>
          </div>
          <label class="toggle"><input type="checkbox" id="input-webp-enabled"><span class="toggle-slider"></span></label>
        </div>
        <div class="settings-range-field">
          <label class="settings-value-row" for="input-webp-quality"><span class="settings-label">图片质量</span><output class="settings-value" id="quality-value" for="input-webp-quality">80</output></label>
          <input type="range" id="input-webp-quality" min="1" max="100" value="80" class="field-range">
          <p class="field-hint">适用于 JPEG / WebP，推荐 75–85</p>
        </div>
      </section>

      <section class="settings-card" aria-labelledby="upload-settings-title">
        <h3 class="settings-card-title" id="upload-settings-title">上传速度</h3>
        <label class="settings-value-row" for="input-upload-concurrency"><span class="settings-label">同时上传</span><span class="settings-value"><output id="concurrency-value" for="input-upload-concurrency">3</output> 个</span></label>
        <input type="range" id="input-upload-concurrency" min="1" max="6" value="3" class="field-range">
        <p class="field-hint">推荐 2–4 个，网络不稳定时适当调低</p>
      </section>

      <div class="settings-save">
        <button id="btn-save-image-settings" class="btn btn-primary full-width">保存设置</button>
        <p class="settings-sync-note">设置与历史由服务端保存，各设备共用</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js?v=41"></script>
</body>
</html>
