services:
  catbox-imagehost:
    build: .
    image: ghcr.io/uncat2310/catbox-imagehost:latest
    container_name: catbox-imagehost
    restart: unless-stopped
    ports:
      - "127.0.0.1:7800:7800"
    volumes:
      - ./catbox-imagehost:/app/config
    environment:
      PORT: "7800"
      CATBOX_USERHASH: ${CATBOX_USERHASH:?请在 .env 中配置 CATBOX_USERHASH}
      APP_PASSWORD: ${APP_PASSWORD:?请在 .env 中配置至少16位的 APP_PASSWORD}
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:7800/api/health', timeout=5)); raise SystemExit(0 if data.get('ok') else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
